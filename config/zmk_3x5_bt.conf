# ZMK 3x5 Bluetooth Keyboard - user configuration
#
# =====================================================================
# SHIPPING CONFIGURATION - ST-1209RGB, 15 pixels, 5 V rail
# =====================================================================
# Board: nice_nano v2 + zmk_3x5_bt shield, 15x ST-1209RGB on D8 (P1.04).
# Everything below was verified on real silicon; the diagnostics that got it
# there have been removed from the tree rather than left switched off.
#
# WHAT IS PROVEN, AND WHERE THE EVIDENCE LIVES
#   waveform      8 MHz / spi-one-frame 0x7C / spi-zero-frame 0x60 / reset 300.
#                 The only bit encoding that satisfies this part on the
#                 nRF52840's discrete SPIM clock. The full derivation, and the
#                 two speeds that fail on paper, are in the shield overlay.
#   wire order    G,R,B - MEASURED, not read off the datasheet. The vendor says
#                 RGB, but the parts on this board answer GREEN to a request for
#                 red while answering blue correctly to a request for blue. The
#                 datasheet is wrong on this one point, and the fix belongs in
#                 the overlay's color-mapping, not in a renderer.
#   topology      the daisy chain is HEALTHY - every LED receives its own slice
#                 of the bitstream. Proven by the split-frame test: 8 red + 7
#                 blue with a clean boundary, which a parallel bus cannot
#                 produce. The earlier "parallel bus" and "broken chain"
#                 readings were withdrawn. See LED1209-release-verify.md.
#
# BOOT FINGERPRINT
#   This build has NO blue-LED boot signature, and the strip stays DARK at boot
#   (DEFAULT_EFFECT=0, deliberately - see the effects section at the bottom).
#   A dark strip is correct behaviour here, not a fault. Press Y+N to bring an
#   effect up, and keep pressing it to cycle back round to OFF.
#
# STILL OUTSTANDING - both hardware, neither fixable in firmware
#   1. COMMON GROUND. The external 5 V supply's GND must be continuous with the
#      mainboard GND. Measure LED1's GND pad against the mainboard GND and
#      expect about 0 ohm; without it the DIN reference floats.
#   2. VIH MARGIN. At VDD 5 V this part's nominal VIH is about 3.5 V, and P1.04
#      only swings 3.3 V, so the interface is out of spec on paper. It decodes
#      anyway - which measures this part's real VIH as below 3.3 V, a number the
#      datasheet does not give. The 74AHCT1G125 level shifter is still the
#      correct design; its VCC (pin 5) must be 5 V, never 3.3 V.
# =====================================================================

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR=y
CONFIG_BT_GATT_DYNAMIC_DB=n

# --- BLE connection parameters: pinned for input latency ---
# ZMK never sets these, so it silently inherits its own defaults from
# app/Kconfig (inside `if ZMK_BLE`), which are tuned for battery life rather
# than for how fast a keystroke lands. Those defaults let the peripheral skip up
# to 30 connection events; at the default 15 ms interval that is a 465 ms window
# in which the link simply is not listening.
#
#   MIN_INT / MAX_INT = 6   collapse the interval to the 7.5 ms legal floor, so
#                           a report can never wait for a 15 ms anchor
#   LATENCY = 0             withdraw the "the peripheral may nap" permission
#
# COST: latency 0 keeps the radio listening on every connection event, which is
# the single biggest battery lever on a wireless keyboard. It is kept at 0 on
# purpose - this is a desk-bound board, and a 465 ms wake-up penalty on the
# first key after a pause is a worse trade than the current. Raise LATENCY to
# 30 if runtime matters more than response.
#
# These are PERIPHERAL PREFERENCES. The host may still impose its own values
# (Windows BLE HID commonly runs 11.25 ms), so setting them here is necessary
# but not always sufficient.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Power / sleep ---
CONFIG_ZMK_SLEEP=y
# Ten minutes of idle sends the board to sleep. ZMK's ext-power driver also
# drops the P0.13 3.3 V gate on suspend, which takes the LED rail down with it -
# that is intended, the strip being the largest current draw in this firmware.
# Any key press wakes the board.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# --- USB: wired mode ---
# CONFIG_ZMK_USB is the only line needed. Kconfig selects USB, USB_DEVICE_STACK
# and USB_DEVICE_HID from it (see `config ZMK_USB` in app/Kconfig), and Zephyr
# already defaults USB_DEVICE_STACK to y on SoCs with a USB device controller.
#
# With both transports up, ZMK prefers USB - so a board that is plugged in for
# power while also bonded over Bluetooth sends keystrokes down USB. Press the
# I+K combo to put them back on the air without unplugging; that choice is
# persisted to NVS and survives a reboot.
CONFIG_ZMK_USB=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# No USB CDC ACM logging - UART logging is enough. USB_UART_CONSOLE is only
# defined when ZMK_USB_LOGGING=y selects it.

# --- LED strip: 15x ST-1209RGB on D8 (P1.04), via SPI3 ---
# The Zephyr WS2812 SPI driver stays enabled. ZMK's built-in underglow is
# deliberately off: our own module self-renders the same zmk,led-strip device
# and the two would fight over it.
CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFFECTS_START_ON_BOOT=n
# CONFIG_ZMK_RGB_UNDERGLOW_EFFECT=0
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# CONFIG_ZMK_RGB_UNDERGLOW_BRIGHTNESS_START=80

# --- zmk-rgb-player module ---
CONFIG_ZMK_RGBEFFECT=y

# --- Logging: OFF ---
# CONFIG_LOG=n compiles every LOG_* macro away entirely, arguments included.
# Worth having off on this board: Zephyr defaults to LOG_MODE_DEFERRED, so each
# line is handed to a log thread that drains it through a POLLED UART writer -
# about 87 us per character at 115200 baud, i.e. ~22 ms of CPU burned per
# keystroke on a string nobody can read, because these UART pins are not broken
# out anyway. Turn it on only while actively debugging over serial.
CONFIG_LOG=n

# --- Effects ---
# 0 (OFF) at boot, deliberately. This board runs on a battery and the strip is
# the largest optional current draw in the firmware: a 15-pixel animated effect
# is roughly 85-100 mA, against a few mA for the MCU alone. OFF starts no render
# tick at all, which is the cheapest possible idle state.
#
#   0 OFF / 1 solid / 2 breathing / 3 rainbow / 4 single-key / 5 twinkle / 6 ripple
#
# The Y+N combo cycles all seven at runtime and the choice is not persisted, so
# a reboot comes back to OFF. Set 3 here if you want visual proof at boot that
# the strip is alive; that is what the bring-up builds used.
CONFIG_ZMK_RGB_PLAYER_DEFAULT_EFFECT=0
