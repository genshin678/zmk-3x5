# ZMK 3x5 Bluetooth Keyboard - User Configuration

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR=y
CONFIG_BT_GATT_DYNAMIC_DB=n

# --- BLE connection parameters: pinned for latency (LATFIX) ---
# The board now types correctly over Bluetooth; what is left is INPUT LATENCY.
# ZMK never sets these four, so it silently inherits ZMK's own defaults from
# app/Kconfig (inside `if ZMK_BLE`), which are tuned for BATTERY LIFE, not for
# how fast a keystroke lands:
#
#   BT_PERIPHERAL_PREF_MIN_INT  default 6   ->  7.5 ms
#   BT_PERIPHERAL_PREF_MAX_INT  default 12  -> 15.0 ms  <- lets the host sit at
#                                                          15 ms per report
#   BT_PERIPHERAL_PREF_LATENCY  default 30  -> the peripheral may SKIP UP TO 30
#                                              connection events. At a 15 ms
#                                              interval that is a 465 ms window
#                                              in which the link is asleep.
#   BT_PERIPHERAL_PREF_TIMEOUT  default 400 ->  4 s
#
# Overriding all four does two things:
#   * MAX_INT=6 collapses the interval to the 7.5 ms legal floor, so a report
#     can never wait a 15 ms anchor;
#   * LATENCY=0 removes the "peripheral is allowed to nap" permission entirely.
#
# COST: latency 30 -> 0 keeps the radio listening on every connection event,
# which is the single biggest battery lever on a wireless keyboard. Restore
# LATENCY=30 before shipping if battery life matters more than response; for a
# desk-bound board, keep 0.
#
# Worth knowing: these are PERIPHERAL PREFERENCES. The host may still impose
# its own values (Windows BLE HID commonly runs 11.25 ms), so a change here is
# necessary but not always sufficient - the host-side checklist in
# LATFIX-verify.md covers the other half.
#
# Symbol names verified against ZMK v0.3's app/Kconfig; Zephyr's host Kconfig
# ranges are MIN_INT 6..3200, LATENCY 0..500, TIMEOUT 10..3200, so all four
# values below are in range and legal.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Power / Sleep (battery powered) ---
CONFIG_ZMK_SLEEP=y
# TEMPORARY bring-up value: ZMK's ext-power driver disables the rail on PM
# suspend, so a 10 min idle timeout can silently shut the WS2812B/TXS0102 rail
# off and be mistaken for a hardware fault. 1 h keeps the board awake for
# bench measurements. Restore 600000 before shipping.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- USB: ENABLED (wired mode restored) ---
# The BLEFIX revision turned this off while chasing "Bluetooth is connected but
# no keys come out". That diagnosis was wrong - the real causes were the
# keymap's HID usage IDs and a stale bond, both since fixed - while turning USB
# off also removed wired mode entirely, which reads as a regression to anyone
# who plugs the board in.
#
# The endpoint rule this exists to guard against, from app/src/endpoints.c:
#
#     static enum zmk_transport preferred_transport = ZMK_TRANSPORT_USB;  <- default
#     static enum zmk_transport get_selected_transport(void) {
#         if (is_ble_ready()) {
#             if (is_usb_ready()) return preferred_transport;  /* both up -> USB */
#             return ZMK_TRANSPORT_BLE;
#         }
#         if (is_usb_ready()) return ZMK_TRANSPORT_USB;
#         return DEFAULT_TRANSPORT;               /* = BLE when ZMK_BLE=y */
#     }
#
# Reports are NOT mirrored - only ONE endpoint is ever used. So a board plugged
# into a computer for power while also bonded over Bluetooth sends keystrokes
# down USB by default. That is usually what you want (plug in = wired), and if
# you need the keystrokes back on the air without unplugging, press the I+K
# combo, bound to &out OUT_TOG in the keymap. That choice is persisted to NVS
# by zmk_endpoints_select_transport(), so it survives a reboot.
#
# Correcting an earlier note that lived here: CONFIG_USB_DEVICE_STACK is not
# something to set, and it was never "vestigial" either. Zephyr already
# defaults it to y whenever the SoC has a USB device controller
# (`default y if HAS_HW_NRF_USBD`), which the nRF52840 does - it showed up as
# =y in the BLEFIX build's own config dump. CONFIG_ZMK_USB=y is the only line
# needed; Kconfig then selects USB, USB_DEVICE_STACK and USB_DEVICE_HID for it
# (see `config ZMK_USB` in app/Kconfig).
#
# Side benefit: with ZMK_USB=y, is_usb_power_present() reports the real VBUS
# state, so activity.c will not power the board off while it is plugged in.
CONFIG_ZMK_USB=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# USB_UART_CONSOLE is only defined when ZMK_USB_LOGGING=y selects it.
# We don't need USB CDC ACM logging; just printing logs to UART is fine.

# --- RGB LEDs (WS2812B on D8/P1.04 via SPI3 bitbang) ---
# Driver stays on; ZMK built-in underglow is DISABLED because our custom
# zmk-rgb-player module self-renders the same zmk,led-strip and would fight
# the built-in underglow for the device.
CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW is intentionally disabled (see above).
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFFECTS_START_ON_BOOT=n
# CONFIG_ZMK_RGB_UNDERGLOW_EFFECT=0
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# CONFIG_ZMK_RGB_UNDERGLOW_BRIGHTNESS_START=80

# --- zmk-rgb-player custom module ---
CONFIG_ZMK_RGBEFFECT=y

# --- Logging: OFF (LATFIX) ---
# ZMK v0.3 does not turn the Zephyr logging subsystem on by itself - CONFIG_LOG=y
# was our own line. It costs real time here: the BRINGUP build emits one ~250
# character LOG_INF per key press from the LED thread. Zephyr defaults to
# LOG_MODE_DEFERRED, so that string is handed to the log process thread, which
# drains it through the UART console with a POLLED (busy-wait) writer - about
# 87 us per character at 115200 baud, i.e. ~22 ms of CPU burned per keystroke on
# a string nobody can read, because the board's UART pins are not wired to
# anything.
# With LOG=n every LOG_* macro compiles away entirely and its arguments are not
# even evaluated, so the cost disappears along with the text.
# Turn it back on only while actively debugging over a serial connection.
# (was: CONFIG_LOG=y)
CONFIG_LOG=n

# --- Hardware bring-up self test: TURNED OFF in the USBRGB revision ---
# Everything below describes the PAIRFIX diagnostic build. It is kept as a
# record only. CONFIG_ZMK_RGB_PLAYER_BRINGUP is no longer set, so src/bringup.c
# does no work and the read-outs it documents (per-layer blue-LED blinks, the
# open/taken 2-vs-3 blip code, the eight-blink signature) do NOT apply any more.
# The board is verified: the matrix scans, the keymap types the right
# characters, pairing works. Turn the option back on if a future board needs
# the same bring-up ladder.
#
# PAIRFIX revision. Bluetooth now types correctly and every key is right, but a
# bond clear followed by a re-pair FAILED: the host reported "cannot pair with
# this device". Root cause found in ZMK's own source, not guessed - see
# PAIRFIX-verify.md. Two firmware changes:
#   1. behavior_bt_clear_bonds.c called bt_unpair() on its own. That is only
#      HALF of a clear: app/src/ble.c's clear_profile_bond() also calls
#      set_profile_address(profile, BT_ADDR_LE_ANY), and that second call is
#      what marks the profile "open". Without it zmk_ble_profile_is_open() stays
#      false, so auth_pairing_accept() returns BT_SECURITY_ERR_PAIR_NOT_ALLOWED
#      and the keyboard itself rejects the host's pairing request. The behavior
#      now calls the public zmk_ble_clear_all_bonds(), i.e. exactly what ZMK's
#      stock `&bt BT_CLR_ALL` does.
#   2. bringup.c now shows OPEN vs TAKEN on the blue LED (2 vs 3 blips), closing
#      the blind spot that hid this for a round - before PAIRFIX the idle
#      indicator only ever read is_connected(), so "will accept a pairing" and
#      "will REFUSE a pairing" looked identical.
#
# RECOVERY AFTER FLASHING THIS BUILD: **press the U+M+O+. combo once.** The
# broken state lives in NVS (ZMK stores the profile addresses as
# `ble/profiles/%d` settings), so reflashing alone does not undo it - but the
# fixed combo does, because zmk_ble_clear_all_bonds() ends in
# set_profile_address(ANY), which also rewrites that NVS entry. Watch the blue
# LED: 3 blinks = profile still taken, 2 blinks = open and pairable.
#
# An automatic boot-time repair was written and then DELIBERATELY REMOVED: its
# detection needs bt_addr_le_is_bonded(), which no header reachable from
# bringup.c declares (bluetooth/bluetooth.h, conn.h and addr.h were all checked
# against the exact Zephyr in use, zmkfirmware/zephyr v3.5.0+zmk-fixes). An
# implicit declaration assumes int for a function that returns bool - UB, and CI
# flagged it as -Wimplicit-function-declaration. Not worth shipping to save one
# key press. See the note above led_thread() in bringup.c.
#
# --- The LATFIX revision, kept for the record ---
# The typing path already worked and every key was correct, so the question had
# changed from "does anything come out" to "why is it slow". Three changes:
#   1. BLE connection parameters pinned above - LATENCY 30 -> 0, MAX_INT 12 -> 6
#   2. CONFIG_LOG=n - the per-keystroke log line cost ~22 ms of CPU each time
#   3. the WS2812 strip thread is disabled in bringup.c (BU_ENABLE_STRIP 0)
#
# --- The KPTEST revision, kept for the record ---
# Two changes, both aimed at the same open question: does a
# keystroke ever become a real HID report, or does the board only *look* alive?
#
# CHANGE 1 - the typing path is ZMK's STOCK &kp, not the hand-rolled &kp_we.
#   The keymap now reads `&kp Y  &kp U  &kp I ...` using symbols from
#   dt-bindings/zmk/keys.h. Two consequences:
#     * the official pipeline runs verbatim -
#       &kp -> raise_zmk_keycode_state_changed_from_encoded -> hid_listener ->
#       zmk_hid_keyboard_press() -> zmk_endpoints_send_report(HID_USAGE_KEY) -
#       so a failure can no longer hide inside our own behaviour;
#     * the symbols are usage IDs by construction, so the earlier
#       boot-protocol-vs-usage-ID bug (N 0x11 really meant J, M 0x10 meant I)
#       has nothing to get wrong.
#   &kp_we stays compiled in but unreferenced; the ripple it used to trigger is
#   replaced by the strip's kscan-driven white marker (L1), which does not
#   depend on the keymap at all.
#
# CHANGE 2 - the HID report probe is STICKY and POLLED, not a single sample.
#   The old probe sampled the report once, 50 ms after the press. If press and
#   release both landed before that sample fired - a quick tap, or kscan
#   debounce merging them - the report had already been cleared and the probe
#   reported "empty" for what may have been a perfectly good keystroke. The LED
#   thread now polls the live report every 20 ms across the whole 300 ms
#   collection window and latches a sticky flag, so no press/release timing can
#   hide a non-empty report. n_l3 counts empty -> non-empty transitions.
#
#   L1  zmk_position_state_changed (raised by kscan, BEFORE the keymap) proves
#       the PHYSICAL layer: switch, diode, trace, kscan pins, scan timing.
#   L3  the HID keyboard report itself. This is the fact that matters.
#   L2  bringup_key_event() is still called from effects.c but is LOGGED ONLY
#       and not counted - on HIDCHK it was the proof that &kp_we ran, and
#       &kp_we is no longer in the path.
#
# READ-OUT on the on-board blue LED (P0.15), which runs on its OWN thread (as
# does the strip) so a blocked spi_write() can neither starve the indicator nor
# fake its timing. Two different read-outs share the one LED:
#
# On a key press the LED blinks once per layer that reported:
#   2 blinks = kscan AND a non-empty HID report -> the firmware is complete
#              end-to-end and a real keycode was handed to the BLE HOG. A host
#              that still shows nothing is a HOST / BLE-LINK fault.
#   1 blink  = kscan only, the report never filled -> the fault is at or below
#              the HID report (report size / report type / the endpoint)
#   0 blinks = kscan never fired -> physical layer (switch/diode/trace/pin)
#
# While idle the LED reports the PAIRING state, which is what PAIRFIX added.
# Before PAIRFIX this only ever read is_connected(), so "open and would accept a
# pairing" and "already holds a bond and will REFUSE pairing" looked identical -
# and that blind spot is exactly how the bug below hid for a whole round.
#   1 Hz heartbeat        = connected
#   2 blips every 2 s     = not connected, active profile OPEN  -> pairable
#   3 blips every 2 s     = not connected, profile TAKEN        -> ZMK REFUSES
#                           the pairing request (PAIR_NOT_ALLOWED). The host
#                           says "cannot pair with this device", and nothing on
#                           the host can fix it. Press U+M+O+. to clear.
#
# BOOT SIGNATURE IS EIGHT QUICK BLINKS (this is the PAIRFIX build). Count them:
# PAIRFIX 8, LATFIX 7, KPTEST 6, LAYERS / HIDCHK 5. The boot-blink count is the
# only reliable way to tell which build is actually flashed.
# Then, while idle: a 1 Hz heartbeat when Bluetooth is connected; a double-blip
# every 2 s when it is NOT connected and the active profile is OPEN (ZMK will
# accept a pairing request); a TRIPLE-blip every 2 s when it is not connected
# but the profile still holds an address (ZMK will REFUSE pairing - see below).
#
# "Remove this line once the hardware is verified" -> DONE. See the banner at
# the top of this section. The knob is off now and the strip is driven by the
# real effect engine instead of by the diagnostic pattern.
# (was: CONFIG_ZMK_RGB_PLAYER_BRINGUP=y)

# --- RGBeffect: BACK ON (this was one of the three complaints) ---
# While CONFIG_ZMK_RGB_PLAYER_BRINGUP was set, effects.c had
# effects_set_active() return immediately, so the 4-corner combo cycled nothing
# and the strip could never light. With the knob off the engine is live again,
# and this line picks which of the seven effects runs at boot:
#   0 OFF / 1 solid / 2 breathing / 3 rainbow / 4 single-key / 5 twinkle / 6 ripple
# 3 (rainbow) is deliberate: it is unmistakable proof that the strip works.
# Set 0 for the longest battery life - OFF is the only effect with no render
# tick at all. Note that the firmware default is 0 and effects_init() does not
# start the tick by itself, so 0 really does mean a dark strip at boot.
CONFIG_ZMK_RGB_PLAYER_DEFAULT_EFFECT=3

# --- BLE link-latency probe (TEMPORARY, diagnostic) ---
# Answers "after a pause the first key is slow" with a number instead of a
# guess: src/btdiag.c blinks the blue LED 1..5 times per key press, the count
# encoding the worst-case wait for a keystroke in ms (1: <=10, 2: <=20,
# 3: <=50, 4: <=100, 5: >100), preceded by ONE LONG 500 ms flash. It used to be
# a blink count (eighteen for CHAINPROBE); the count was abandoned because
# nobody can count eighteen 120 ms blinks by eye - see src/btdiag.c.
#
# It exists because the obvious explanation does not fit: a slow connection
# interval would make EVERY key slow, not just the first one after a pause, and
# the same lag shows on a phone, so the host is not the variable. ZMK only
# advertises a connection-parameter PREFERENCE and never asks the host to honour
# it (app/src/ble.c registers only the passive le_param_updated callback and has
# no bt_conn_le_param_update call), so whether the host relaxes the link while
# idle has to be MEASURED. Turn this off once the question is answered - it
# costs a thread, a connection callback and a key-press subscription.
CONFIG_ZMK_RGB_PLAYER_BTDIAG=y
# LOGGING IS OFF IN THIS BUILD - see CONFIG_LOG=n above. The probe messages are
# still in the source and come back the instant CONFIG_LOG is set to y again;
# nothing in bringup.c needs editing.
#
# Correction to an earlier note that lived here: ZMK_LOG_LEVEL is NOT a bool.
# ZMK v0.3's app/Kconfig declares it with no type at all (`config ZMK_LOG_LEVEL`
# / `default 4`), which is why assigning CONFIG_ZMK_LOG_LEVEL=4 or =DBG from a
# .conf aborts kconfig.py. It does not need assigning either way - 4 is already
# the default (Zephyr's LOG_LEVEL_DBG). CONFIG_LOG is the one real switch, and
# it is now n.

# --- CHAINPROBE build: WS2812 daisy-chain inspector at boot -------------
# This is the CHAINPROBE diagnostic. It lights ONE DATA INDEX at a time so the
# board itself tells you the physical<->data topology of the strip - the only
# reliable method, because a multimeter cannot (continuity beeps through the ESD
# clamp diodes and the TXS0102 0.5 mm pins; two readings the same afternoon
# contradicted each other).
#
# CONFIG_ZMK_RGB_PLAYER_BTDIAG=y STAYS ON in this build on purpose: the blue
# LED's boot flash is the only way to confirm this exact build is flashed. It is
# ONE LONG 500 ms flash - see src/btdiag.c for why the old eighteen-blink count
# was abandoned. After the flash the strip takes over.
#
# Behaviour (see the file header of src/chainprobe.c for the full read-out
# table).
#
#   PHASE 1 (once, held still 4 s so it can be looked at and photographed):
#     pixels 0..7 RED, pixels 8..14 BLUE. This static frame is the whole
#     topology answer - half red / half blue means the chain is healthy, all
#     fifteen red means every DIN is on one net (parallel bus), and fewer than
#     fifteen lit means the chain breaks at the red/blue boundary.
#
#   PHASE 2 (forever): index 0 = RED held 3 s, then indices 1..14 each held
#     0.9 s in their own colour, then 1.75 s with the whole strip dark, then
#     the walk repeats.
#
# NO KEY CAN END IT - deliberately, and this is the third attempt. v15 exited on
# ANY key event, so the boot phantom press killed the run inside its own 400 ms
# settle sleep; v16 added a 3 s grace window that drops key events, which only
# covers the first 3.4 s, so a phantom press arriving after it on a pin that
# never releases still ended the run. This revision takes NO key input at all.
# Power the board off to leave the walk, and reflash hw-bringup for normal
# operation.
#
# The effects engine is ALSO made inert under CHAINPROBE (see the gate at the
# top of effects_set_active() in src/effects.c): its render thread is never
# created, so the probe is provably the only writer on the strip. If a smooth
# gradient rainbow appears while this build is flashed, the image running is not
# this build.
#
# Three outcomes, read off the PHASE 1 split frame:
#   A) HALF the strip red, the other half blue        -> HEALTHY CHAIN. Every
#                                                        LED is receiving its
#                                                        own slice of the
#                                                        bitstream; there is no
#                                                        wiring fault to find.
#                                                        (If the BLUE half is
#                                                        the end data enters
#                                                        from, the strip runs
#                                                        mirrored - harmless.)
#   B) ALL 15 red, blue NEVER shows up                -> PARALLEL BUS. Every DIN
#                                                        is on one net, so every
#                                                        LED sees the same first
#                                                        24 bits and can only
#                                                        ever show pixel 0.
#                                                        Board fault: cut the
#                                                        common net and wire
#                                                        DOUT(n) -> DIN(n+1).
#                                                        Do NOT add a jumper.
#   C) fewer than 15 lit, or the red/blue boundary    -> the LIT COUNT is how
#      in the wrong place                                many LEDs the data
#                                                        reaches and the
#                                                        boundary is where the
#                                                        chain breaks. Fly a
#                                                        wire from the last LED
#                                                        that responds to the
#                                                        next one's DIN.
CONFIG_ZMK_RGB_PLAYER_CHAINPROBE=y

# --- COMBOFIX revision (this build): the combos were the latency -----
# Three complaints arrived together - "wired and Bluetooth both got slower",
# "pressing several keys at once produces almost nothing", "a single key press
# feels stuck" - and none of them is a transport problem. They are all the
# COMBO ENGINE, which sits upstream of the endpoint, and that is exactly why
# BOTH endpoints looked equally bad.
#
# Root cause, read out of app/src/combo.c rather than guessed:
#   * position_state_down() returns ZMK_EV_EVENT_CAPTURED for any position in
#     combo_lookup while a candidate is live, so that key's own keycode is NOT
#     emitted - the keymap never sees the event.
#   * the deadline is pressed_keys[0].timestamp + MIN(timeout_ms over that
#     key's candidates), so timeout-ms is ALSO the stall inflicted on a key
#     pressed on its own. It is not just a chord window.
#   * candidate selection is gated on
#         is_quick_tap(combo, ts)
#             = (last_tapped_timestamp + require_prior_idle_ms) > ts
#     and with require-prior-idle-ms absent that is ALWAYS false - so every
#     combo member was captured on every single press.
#
# Measured cost of the previous keymap (12 of the 15 keys):
#   200 ms   U I O H K ; M .
#    60 ms   Y P N /
#     0 ms   J L ,
#
# Fix - all of it in config/zmk_3x5_bt.keymap, no Kconfig involved:
#   1. every combo now carries require-prior-idle-ms = <200>, so combos stay
#      inert during ordinary typing and only engage after a deliberate pause;
#   2. timeout-ms cut from 200/60/3000 to 80 everywhere;
#   3. dfu_combo's timeout-ms = <3000> was pure loss - behavior_dfu_combo.c
#      already implements the 3 s hold with its own k_work.
#
# Honest attribution: this was PRE-EXISTING, not caused by USBRGB. Earlier
# rounds were asking "does anything come out at all", then "why is the first
# key after a pause slow" - neither of which shows up as a uniform per-key
# stall. The only genuinely new part is out_combo (I+K), which added I and K to
# the captured set.
#
# The other two changes in this revision are LED-side and INDEPENDENT of the
# above. They can be A/B-tested at runtime by cycling to effect 0 (OFF), which
# stops the render thread entirely:
#   * rgb_control.c caps brightness at RGB_MAX_BRIGHTNESS = 96. 15 WS2812B pull
#     up to 60 mA each at full white, so the old default of 128 could ask
#     ~450 mA of a rail that was only just reworked onto 5 V. This also makes
#     "is the strip browning out the MCU?" answerable: a brownout replays the
#     thirteen-blink boot signature.
#   * effects.c now renders from its OWN thread at priority 12 instead of a
#     k_work_delayable on the SYSTEM WORKQUEUE. ZMK scans the key matrix on
#     that same workqueue, so the ~1.2 ms synchronous 360-byte SPI frame used
#     to sit directly in front of the scan. (Recorded rule: never put a long
#     operation on the system workqueue.)

# --- BRIWRAP revision (this build): the brightness combo was DEAD ----------
# Listing the function keys turned up that Y+P did nothing at all. Not a
# hardware or a combo problem - a self-inflicted one from the revision above.
#
#   #define RGB_MAX_BRIGHTNESS 96
#   static uint8_t brightness = RGB_MAX_BRIGHTNESS;   /* boots AT the ceiling */
#
# while the only loop direction was bri_loop_start(BRI_UP) and every step ran
# through the clamp in set_brightness(). Starting at the ceiling and only ever
# stepping up means the value never moves. BRI_DOWN exists in the enum but
# nothing in the tree ever called it.
#
# Fix (of three offered, user chose "wrap at the top"): the loop now WRAPS
# through bri_step() in rgb_control.c - past 96 lands on 0 and climbing
# resumes, below 0 lands back on 96. Holding Y+P sweeps the whole usable
# range; a full sweep is 96 steps x 100 ms ~= 9.6 s.
#
# Two deliberate choices:
#   * rgb_control_change_brightness() still CLAMPS. Wrapping is a property of
#     the *loop*, not of a generic "nudge the value" API, so the wrap lives in
#     bri_step() only - and both loop entry points (bri_loop_start and
#     bri_loop_tick) call it, so they cannot drift apart.
#   * The boot default stays 96. With wrapping, sitting at the ceiling is only
#     a starting point now, not a dead end. Lower it if you want the strip to
#     boot dimmer.
#
# LESSON, since it will recur: adding a clamp and setting the DEFAULT to that
# same clamp disabled the only control that adjusts the value. A ceiling and a
# starting point are two different decisions - do not set them in one edit.

# --- COMBOFIX2 revision (this build): every combo now fires ON PRESS --------
# Two reports, one cause each, both mine:
#
#   1. "The LEDs are always on."  Not a rendering bug - render_off() really
#      does clear the strip. The user simply could not reach it: cycling the
#      effect was a FOUR-key combo (Y+N+P+/) that has to complete within
#      timeout-ms of the first press, and 80 ms does not fit four corners.
#   2. "Holding P+N does nothing."  ZMK's position_state_down() only activates
#      a combo on press when num_candidates == 1:
#
#          if (candidate_is_completely_pressed(candidate_combo)) {
#              fully_pressed_combo = i;
#              if (num_candidates == 1) { cleanup(); }
#          }
#
#      With the corners combo alive, P then N left TWO candidates (dfu_combo
#      and eff_combo), so the binding was not invoked on press - it was invoked
#      at the 80 ms timeout, or on release. And on release, release_combo_key()
#      released it in the SAME event, so behavior_dfu_combo.c's own 3 s timer
#      was cancelled before it could fire.
#
# Fix: delete both four-key combos. Effect cycling is now Y+N, clear-bonds is
# now O+. (held 2 s, so dropping to two keys does not make it dangerous).
# Every remaining combo is two keys, and no two combos share a PAIR, so the
# second key press always collapses the candidate set to 1 - the binding is
# invoked the instant the last key lands, and hold behaviours work normally.
#
# Side effect worth having: U and M no longer belong to any combo, so the
# captured keys drop from 12 of 15 to 9 of 15. Zero added latency.

# --- HSVFIX revision (this build): the rainbow was arithmetically broken ----
# Reported as "the other effects just flicker random colours". It was a real
# bug in effects.c, not the LED wiring:
#
#     uint8_t region = h / 60;                 // h is 0..359, 60 deg per region
#     uint8_t rem    = (h - region * 60) * 6;  // WRONG: overflows, then wraps
#
# The `* 6` factor is copied from the classic 8-bit-hue snippet, where h is
# 0..255 and region = h / 43 - there the remainder is 0..42 and * 6 lands in
# 0..252. With h in 0..359 the remainder is 0..59 and the right factor is
# 255 / 60 = 4.25, so * 6 produced up to 354. rem is a uint8_t, so everything
# >= 256 wrapped modulo 256: the hue->colour mapping became non-monotonic and
# scrambled, and a smooth rainbow read as random flicker.
#
# Fixed to ((h - region * 60) * 255) / 60.

# --- DFU (UF2 bootloader, Adafruit nRF52) ---
# nice_nano ships with the Adafruit nRF52 UF2 bootloader from factory.
# Enter DFU via: hold RESET while plugging USB → NICENANO FATFS appears → drop .uf2.
# No mcuboot Kconfig needed; CONFIG_BOOTLOADER_MCUBOOT=y would pull in mcuboot
# instead of UF2 and conflict with the stock bootloader.