# ZMK 3x5 Bluetooth Keyboard - User Configuration
# Override shield defaults here.

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR=y

# --- Power / Sleep (battery powered) ---
# ZMK_BLE_SLEEP was removed in newer ZMK; deep sleep is now controlled by ZMK_SLEEP + ZMK_IDLE_SLEEP_TIMEOUT only.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# --- USB ---
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y

# --- RGB LEDs (WS2812B on D8/P1.04) ---
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EFFECTS_START_ON_BOOT=y
