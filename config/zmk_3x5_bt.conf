# ZMK 3x5 Bluetooth Keyboard - User Configuration

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR=y
CONFIG_BT_GATT_DYNAMIC_DB=n

# --- BLE connection parameters: pinned for latency (LATFIX) ---
# The board now types correctly over Bluetooth; what is left is INPUT LATENCY.
# ZMK never sets these four, so it silently inherits ZMK's own defaults from
# app/Kconfig (inside `if ZMK_BLE`), which are tuned for BATTERY LIFE, not for
# how fast a keystroke lands:
#
#   BT_PERIPHERAL_PREF_MIN_INT  default 6   ->  7.5 ms
#   BT_PERIPHERAL_PREF_MAX_INT  default 12  -> 15.0 ms  <- lets the host sit at
#                                                          15 ms per report
#   BT_PERIPHERAL_PREF_LATENCY  default 30  -> the peripheral may SKIP UP TO 30
#                                              connection events. At a 15 ms
#                                              interval that is a 465 ms window
#                                              in which the link is asleep.
#   BT_PERIPHERAL_PREF_TIMEOUT  default 400 ->  4 s
#
# Overriding all four does two things:
#   * MAX_INT=6 collapses the interval to the 7.5 ms legal floor, so a report
#     can never wait a 15 ms anchor;
#   * LATENCY=0 removes the "peripheral is allowed to nap" permission entirely.
#
# COST: latency 30 -> 0 keeps the radio listening on every connection event,
# which is the single biggest battery lever on a wireless keyboard. Restore
# LATENCY=30 before shipping if battery life matters more than response; for a
# desk-bound board, keep 0.
#
# Worth knowing: these are PERIPHERAL PREFERENCES. The host may still impose
# its own values (Windows BLE HID commonly runs 11.25 ms), so a change here is
# necessary but not always sufficient - the host-side checklist in
# LATFIX-verify.md covers the other half.
#
# Symbol names verified against ZMK v0.3's app/Kconfig; Zephyr's host Kconfig
# ranges are MIN_INT 6..3200, LATENCY 0..500, TIMEOUT 10..3200, so all four
# values below are in range and legal.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Power / Sleep (battery powered) ---
CONFIG_ZMK_SLEEP=y
# TEMPORARY bring-up value: ZMK's ext-power driver disables the rail on PM
# suspend, so a 10 min idle timeout can silently shut the WS2812B/TXS0102 rail
# off and be mistaken for a hardware fault. 1 h keeps the board awake for
# bench measurements. Restore 600000 before shipping.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- USB: DISABLED (this is the BLEFIX diagnostic, and the prime suspect) ---
# ZMK's endpoint layer keeps ONE "current_instance" (app/src/endpoints.c) and
# send_keyboard_report() delivers to that single transport only - it does NOT
# mirror reports to both. The selection logic is:
#
#     static enum zmk_transport preferred_transport = ZMK_TRANSPORT_USB;  <- default
#     static enum zmk_transport get_selected_transport(void) {
#         if (is_ble_ready()) {
#             if (is_usb_ready()) return preferred_transport;  /* both up -> USB */
#             return ZMK_TRANSPORT_BLE;
#         }
#         if (is_usb_ready()) return ZMK_TRANSPORT_USB;
#         return DEFAULT_TRANSPORT;               /* = BLE when ZMK_BLE=y */
#     }
#
# So on a board that is plugged into USB for power AND bonded over Bluetooth,
# every keystroke goes out over USB and the Bluetooth host receives nothing -
# which is exactly "蓝牙有、按键没输出". With ZMK_USB=n, is_usb_ready() is
# hard-wired false (it is compiled to `return false`), DEFAULT_TRANSPORT falls
# back to ZMK_TRANSPORT_BLE, and the keyboard becomes a pure Bluetooth device.
#
# Revert: set CONFIG_ZMK_USB=y and CONFIG_USB_DEVICE_STACK=y again for a build
# that also exposes a USB HID keyboard.
CONFIG_ZMK_USB=n
# CONFIG_USB_DEVICE_STACK=y   (vestigial with ZMK_USB=n; the nRF USBD driver is
#                              compiled out, so &usbd being "okay" is harmless)
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# USB_UART_CONSOLE is only defined when ZMK_USB_LOGGING=y selects it.
# We don't need USB CDC ACM logging; just printing logs to UART is fine.

# --- RGB LEDs (WS2812B on D8/P1.04 via SPI3 bitbang) ---
# Driver stays on; ZMK built-in underglow is DISABLED because our custom
# zmk-rgb-player module self-renders the same zmk,led-strip and would fight
# the built-in underglow for the device.
CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW is intentionally disabled (see above).
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFFECTS_START_ON_BOOT=n
# CONFIG_ZMK_RGB_UNDERGLOW_EFFECT=0
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# CONFIG_ZMK_RGB_UNDERGLOW_BRIGHTNESS_START=80

# --- zmk-rgb-player custom module ---
CONFIG_ZMK_RGBEFFECT=y

# --- Logging: OFF (LATFIX) ---
# ZMK v0.3 does not turn the Zephyr logging subsystem on by itself - CONFIG_LOG=y
# was our own line. It costs real time here: the BRINGUP build emits one ~250
# character LOG_INF per key press from the LED thread. Zephyr defaults to
# LOG_MODE_DEFERRED, so that string is handed to the log process thread, which
# drains it through the UART console with a POLLED (busy-wait) writer - about
# 87 us per character at 115200 baud, i.e. ~22 ms of CPU burned per keystroke on
# a string nobody can read, because the board's UART pins are not wired to
# anything.
# With LOG=n every LOG_* macro compiles away entirely and its arguments are not
# even evaluated, so the cost disappears along with the text.
# Turn it back on only while actively debugging over a serial connection.
# (was: CONFIG_LOG=y)
CONFIG_LOG=n

# --- Hardware bring-up self test (TEMPORARY, diagnostic) ---
# PAIRFIX revision. Bluetooth now types correctly and every key is right, but a
# bond clear followed by a re-pair FAILED: the host reported "cannot pair with
# this device". Root cause found in ZMK's own source, not guessed - see
# PAIRFIX-verify.md. Two firmware changes:
#   1. behavior_bt_clear_bonds.c called bt_unpair() on its own. That is only
#      HALF of a clear: app/src/ble.c's clear_profile_bond() also calls
#      set_profile_address(profile, BT_ADDR_LE_ANY), and that second call is
#      what marks the profile "open". Without it zmk_ble_profile_is_open() stays
#      false, so auth_pairing_accept() returns BT_SECURITY_ERR_PAIR_NOT_ALLOWED
#      and the keyboard itself rejects the host's pairing request. The behavior
#      now calls the public zmk_ble_clear_all_bonds(), i.e. exactly what ZMK's
#      stock `&bt BT_CLR_ALL` does.
#   2. bringup.c now shows OPEN vs TAKEN on the blue LED (2 vs 3 blips), closing
#      the blind spot that hid this for a round - before PAIRFIX the idle
#      indicator only ever read is_connected(), so "will accept a pairing" and
#      "will REFUSE a pairing" looked identical.
#
# RECOVERY AFTER FLASHING THIS BUILD: **press the U+M+O+. combo once.** The
# broken state lives in NVS (ZMK stores the profile addresses as
# `ble/profiles/%d` settings), so reflashing alone does not undo it - but the
# fixed combo does, because zmk_ble_clear_all_bonds() ends in
# set_profile_address(ANY), which also rewrites that NVS entry. Watch the blue
# LED: 3 blinks = profile still taken, 2 blinks = open and pairable.
#
# An automatic boot-time repair was written and then DELIBERATELY REMOVED: its
# detection needs bt_addr_le_is_bonded(), which no header reachable from
# bringup.c declares (bluetooth/bluetooth.h, conn.h and addr.h were all checked
# against the exact Zephyr in use, zmkfirmware/zephyr v3.5.0+zmk-fixes). An
# implicit declaration assumes int for a function that returns bool - UB, and CI
# flagged it as -Wimplicit-function-declaration. Not worth shipping to save one
# key press. See the note above led_thread() in bringup.c.
#
# --- The LATFIX revision, kept for the record ---
# The typing path already worked and every key was correct, so the question had
# changed from "does anything come out" to "why is it slow". Three changes:
#   1. BLE connection parameters pinned above - LATENCY 30 -> 0, MAX_INT 12 -> 6
#   2. CONFIG_LOG=n - the per-keystroke log line cost ~22 ms of CPU each time
#   3. the WS2812 strip thread is disabled in bringup.c (BU_ENABLE_STRIP 0)
#
# --- The KPTEST revision, kept for the record ---
# Two changes, both aimed at the same open question: does a
# keystroke ever become a real HID report, or does the board only *look* alive?
#
# CHANGE 1 - the typing path is ZMK's STOCK &kp, not the hand-rolled &kp_we.
#   The keymap now reads `&kp Y  &kp U  &kp I ...` using symbols from
#   dt-bindings/zmk/keys.h. Two consequences:
#     * the official pipeline runs verbatim -
#       &kp -> raise_zmk_keycode_state_changed_from_encoded -> hid_listener ->
#       zmk_hid_keyboard_press() -> zmk_endpoints_send_report(HID_USAGE_KEY) -
#       so a failure can no longer hide inside our own behaviour;
#     * the symbols are usage IDs by construction, so the earlier
#       boot-protocol-vs-usage-ID bug (N 0x11 really meant J, M 0x10 meant I)
#       has nothing to get wrong.
#   &kp_we stays compiled in but unreferenced; the ripple it used to trigger is
#   replaced by the strip's kscan-driven white marker (L1), which does not
#   depend on the keymap at all.
#
# CHANGE 2 - the HID report probe is STICKY and POLLED, not a single sample.
#   The old probe sampled the report once, 50 ms after the press. If press and
#   release both landed before that sample fired - a quick tap, or kscan
#   debounce merging them - the report had already been cleared and the probe
#   reported "empty" for what may have been a perfectly good keystroke. The LED
#   thread now polls the live report every 20 ms across the whole 300 ms
#   collection window and latches a sticky flag, so no press/release timing can
#   hide a non-empty report. n_l3 counts empty -> non-empty transitions.
#
#   L1  zmk_position_state_changed (raised by kscan, BEFORE the keymap) proves
#       the PHYSICAL layer: switch, diode, trace, kscan pins, scan timing.
#   L3  the HID keyboard report itself. This is the fact that matters.
#   L2  bringup_key_event() is still called from effects.c but is LOGGED ONLY
#       and not counted - on HIDCHK it was the proof that &kp_we ran, and
#       &kp_we is no longer in the path.
#
# READ-OUT on the on-board blue LED (P0.15), which runs on its OWN thread (as
# does the strip) so a blocked spi_write() can neither starve the indicator nor
# fake its timing. Two different read-outs share the one LED:
#
# On a key press the LED blinks once per layer that reported:
#   2 blinks = kscan AND a non-empty HID report -> the firmware is complete
#              end-to-end and a real keycode was handed to the BLE HOG. A host
#              that still shows nothing is a HOST / BLE-LINK fault.
#   1 blink  = kscan only, the report never filled -> the fault is at or below
#              the HID report (report size / report type / the endpoint)
#   0 blinks = kscan never fired -> physical layer (switch/diode/trace/pin)
#
# While idle the LED reports the PAIRING state, which is what PAIRFIX added.
# Before PAIRFIX this only ever read is_connected(), so "open and would accept a
# pairing" and "already holds a bond and will REFUSE pairing" looked identical -
# and that blind spot is exactly how the bug below hid for a whole round.
#   1 Hz heartbeat        = connected
#   2 blips every 2 s     = not connected, active profile OPEN  -> pairable
#   3 blips every 2 s     = not connected, profile TAKEN        -> ZMK REFUSES
#                           the pairing request (PAIR_NOT_ALLOWED). The host
#                           says "cannot pair with this device", and nothing on
#                           the host can fix it. Press U+M+O+. to clear.
#
# BOOT SIGNATURE IS EIGHT QUICK BLINKS (this is the PAIRFIX build). Count them:
# PAIRFIX 8, LATFIX 7, KPTEST 6, LAYERS / HIDCHK 5. The boot-blink count is the
# only reliable way to tell which build is actually flashed.
# Then, while idle: a 1 Hz heartbeat when Bluetooth is connected; a double-blip
# every 2 s when it is NOT connected and the active profile is OPEN (ZMK will
# accept a pairing request); a TRIPLE-blip every 2 s when it is not connected
# but the profile still holds an address (ZMK will REFUSE pairing - see below).
#
# Remove this line once the hardware is verified.
CONFIG_ZMK_RGB_PLAYER_BRINGUP=y
# LOGGING IS OFF IN THIS BUILD - see CONFIG_LOG=n above. The probe messages are
# still in the source and come back the instant CONFIG_LOG is set to y again;
# nothing in bringup.c needs editing.
#
# Correction to an earlier note that lived here: ZMK_LOG_LEVEL is NOT a bool.
# ZMK v0.3's app/Kconfig declares it with no type at all (`config ZMK_LOG_LEVEL`
# / `default 4`), which is why assigning CONFIG_ZMK_LOG_LEVEL=4 or =DBG from a
# .conf aborts kconfig.py. It does not need assigning either way - 4 is already
# the default (Zephyr's LOG_LEVEL_DBG). CONFIG_LOG is the one real switch, and
# it is now n.

# --- DFU (UF2 bootloader, Adafruit nRF52) ---
# nice_nano ships with the Adafruit nRF52 UF2 bootloader from factory.
# Enter DFU via: hold RESET while plugging USB → NICENANO FATFS appears → drop .uf2.
# No mcuboot Kconfig needed; CONFIG_BOOTLOADER_MCUBOOT=y would pull in mcuboot
# instead of UF2 and conflict with the stock bootloader.